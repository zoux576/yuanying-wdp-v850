name: Suibian Classic Standalone APK
on:
  push:
    branches:
      - ci/suibian-classic-build-20261029
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Install platform
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Build
        working-directory: suibian-classic
        run: gradle --no-daemon :app:assembleDebug
      - name: Verify and copy
        run: |
          APK=suibian-classic/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          unzip -t "$APK" | tail -1
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK"
          mkdir -p deliver
          cp "$APK" deliver/Suibian_Classic_Dual_38.8.1_debug.apk
          sha256sum deliver/*.apk > deliver/checksums.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: Suibian-Classic-Dual-APK
          path: deliver/
          retention-days: 7
